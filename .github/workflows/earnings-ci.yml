name: Earnings integration checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  earnings-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile modified Python modules
        run: python -m compileall -q app.py earnings.py pipeline.py scanner_mcp.py
      - name: Run pure logic regression tests
        run: python -m pytest -q tests/test_earnings.py tests/test_pipeline.py
