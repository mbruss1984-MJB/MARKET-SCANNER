services:
  - type: web
    name: longbridge-ignition-scanner
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: POLL_SECONDS
        value: '60'
      - key: SYMBOLS
        value: WFF.US,VEEA.US,OFAL.US,MRNA.US
      - key: LONGPORT_APP_KEY
        sync: false
      - key: LONGPORT_APP_SECRET
        sync: false
      - key: LONGPORT_ACCESS_TOKEN
        sync: false
